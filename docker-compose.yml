services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  nexus:
    build: .
    environment:
      NEXUS_OLLAMA_BASE_URL: http://ollama:11434
      NEXUS_DEFAULT_PROVIDER: ollama
      NEXUS_DEFAULT_MODEL: llama3.2
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
  open_webui_data:
