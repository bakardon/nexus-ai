[project]
name = "nexus-ai"
version = "0.3.0"
description = "A modular personal intelligence system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "langgraph>=0.3",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "ddgs>=9",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
