# Task profiles are optional starting points, not permanent silos.
# NEXUS creates/selects a task workspace from the user's request.
# Add tools here when a new capability is implemented.

profiles:
  general:
    description: "General assistant"
    tools: [web_search, calculator]
    memory_scope: core
    approval_required: false

  research:
    description: "Evidence-focused research and analysis"
    tools: [web_search, calculator]
    memory_scope: task
    approval_required: false

  decision:
    description: "Structured decision support"
    tools: [web_search, calculator]
    memory_scope: task
    approval_required: false

  content:
    description: "Create and refine content"
    tools: [web_search]
    memory_scope: task
    approval_required: true

  social_content:
    description: "Plan, draft, review, and optionally publish social content"
    tools: [web_search]
    memory_scope: task
    approval_required: true

# Add a new profile without changing the agent code.
